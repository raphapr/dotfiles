;====General Settings======================================
[colors]
base = #1E1E2E
mantle = #181825
text = #CDD6F4
subtext = #A6ADC8
surface0 = #313244
surface1 = #45475A
blue = #89B4FA
red = #F38BA8
yellow = #F9E2AF
green = #A6E3A1
teal = #94E2D5
mauve = #CBA6F7

[margin]
for-modules = 1

[bar/main]
width = 100%
height = 20
fixed-center = true
line-size = 2
background = ${colors.base}
foreground = ${colors.text}
font-0 = "Fantasque Sans Mono:pixelsize=10;2"
font-1 = "Iosevka Nerd Font Mono:pixelsize=22;4"
font-2 = "Iosevka Nerd Font Mono:pixelsize=13;2"
font-3 = "Iosevka Nerd Font Mono:pixelsize=12;4"
cursor-click = pointer
tray-position = right
enable-ipc = true

;====Module settings======================================
modules-left = workspaces spotify
modules-center = date
modules-right = kubectl vpn screensaver keyboard backlight bluetooth volume memory cpu-graph battery

;====Left modules==========================================
[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 0
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.mauve}

label-focused =  %index%
label-focused-foreground = ${colors.text}
label-focused-background = ${colors.surface0}
label-focused-underline = ${colors.blue}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = ${colors.blue}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-separator =
label-separator-padding = 0
label-separator-foreground = ${colors.text}

;====Center modules========================================
[module/date]
type = internal/date
interval = 1
format-prefix = "  "
format-underline = ${colors.blue}
format-padding = 1
label = %time%
label-font = 1
time = %d/%m/%y %T

;====Right modules=========================================
[module/screensaver]
type = custom/script
exec = cat ~/.screensaver-state
format = 󰍹 <label>
format-underline = ${colors.blue}
format-padding = 1
format-margin = ${margin.for-modules}
format-font = 1
click-left = bash ~/.bin/suspend-screensaver &
interval = 1

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = %{A1:$HOME/.bin/klayout-toggle:} <label-layout> <label-indicator>%{A}
format-underline = ${colors.blue}
format-padding = 1
format-margin = ${margin.for-modules}
format-font = 1

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
use-actual-brightness = true
enable-scroll = true
format =  <bar>
bar-width = 8
bar-indicator = 
bar-indicator-foreground = ${colors.green}
bar-fill = ─
bar-fill-foreground = ${colors.green}
bar-empty = ─
bar-empty-foreground = ${colors.surface1}
format-underline = ${colors.blue}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth-status.sh
interval = 5
format = <label>
format-underline = ${colors.blue}
format-padding = 1
format-margin = ${margin.for-modules}
format-font = 3
click-left = kitty --class=command-hub-bluetui -e bluetui

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
format-volume-underline = ${colors.blue}
format-volume-padding = 1
label-volume = 
label-muted = 󰖁
label-muted-underline = ${colors.blue}
label-muted-padding = 1
bar-volume-width = 8
bar-volume-foreground-0 = ${colors.green}
bar-volume-foreground-1 = ${colors.green}
bar-volume-foreground-2 = ${colors.green}
bar-volume-foreground-3 = ${colors.green}
bar-volume-foreground-4 = ${colors.green}
bar-volume-foreground-5 = ${colors.yellow}
bar-volume-foreground-6 = ${colors.yellow}
bar-volume-foreground-7 = ${colors.red}
bar-volume-gradient = false
bar-volume-indicator = 
bar-volume-indicator-foreground = ${colors.green}
bar-volume-fill = ─
bar-volume-empty = ─
bar-volume-empty-foreground = ${colors.surface1}
format-muted-margin = ${margin.for-modules}
format-volume-margin = ${margin.for-modules}
click-right = kitty --class=command-hub-wiremix -e wiremix
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +10%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -10%
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle


[module/cpu-graph]
type = internal/cpu
interval = 1
format =   <ramp-coreload>
format-underline = ${colors.blue}
format-margin = ${margin.for-modules}
format-padding = 1
ramp-coreload-0 = ▁
ramp-coreload-0-foreground = ${colors.blue}
ramp-coreload-1 = ▂
ramp-coreload-1-foreground = ${colors.teal}
ramp-coreload-2 = ▃
ramp-coreload-2-foreground = ${colors.green}
ramp-coreload-3 = ▄
ramp-coreload-3-foreground = ${colors.green}
ramp-coreload-4 = ▅
ramp-coreload-4-foreground = ${colors.yellow}
ramp-coreload-5 = ▆
ramp-coreload-5-foreground = ${colors.yellow}
ramp-coreload-6 = ▇
ramp-coreload-6-foreground = ${colors.red}
ramp-coreload-7 = █
ramp-coreload-7-foreground = ${colors.red}
ramp-coreload-font = 4

[module/memory]
type = internal/memory
interval = 1
format-prefix = 
format-underline = ${colors.blue}
format-padding = 1
label = %percentage_used:3%%

label-font = 1

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = AC

format-charging = <animation-charging> <label-charging>
format-charging-underline = ${colors.blue}
format-charging-padding = 1
label-charging = %percentage:2%%
format-charging-margin = ${margin.for-modules}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-underline = ${colors.blue}
format-discharging-padding = 1
label-discharging = %percentage:2%%
format-discharging-margin = ${margin.for-modules}

format-full = <ramp-capacity> <label-full>
format-full-underline = ${colors.blue}
format-full-padding = 1
label-full = %percentage:2%%
format-full-margin = ${margin.for-modules}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.red}
ramp-capacity-2-foreground = ${colors.red}
ramp-capacity-3-foreground = ${colors.red}
ramp-capacity-4-foreground = ${colors.yellow}
ramp-capacity-5-foreground = ${colors.yellow}
ramp-capacity-foreground   = ${colors.text}
ramp-capacity-font = 3
animation-charging-0 = 󰂆
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂉
animation-charging-4 = 󰢞
animation-charging-5 = 󰂊
animation-charging-6 = 󰂅
animation-charging-foreground = ${colors.text}
animation-charging-framerate = 450

[module/spotify]
type = custom/script
format =  <label>
exec = bash ~/.config/polybar/scripts/music.sh
exec-if = playerctl -p cliamp,spotify status
interval = 1
format-padding = 1
format-font = 1
format-margin = ${margin.for-modules}
format-underline = ${colors.blue}
click-left = playerctl -p cliamp,spotify previous &
click-right = playerctl -p cliamp,spotify next &
click-middle = playerctl -p cliamp,spotify play-pause &

;====SRE modules==========================================
[module/kubectl]
type = custom/script
exec = kubectl config current-context 2>/dev/null | sed 's/.*\\///' || echo "none"
interval = 10
format = ⎈  <label>
format-underline = ${colors.blue}
format-padding = 1
format-margin = ${margin.for-modules}
format-font = 1
click-left = ~/.bin/rofi-kubectl-ctx &

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-status.sh
interval = 5
format-underline = ${colors.blue}
format-padding = 1
format-margin = ${margin.for-modules}
format-font = 1
click-left = pritunl-client-electron

