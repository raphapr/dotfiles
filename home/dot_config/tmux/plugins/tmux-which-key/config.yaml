command_alias_start_index: 300

keybindings:
  prefix_table: Space

title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=#cba6f7,align=centre,bold

position:
  x: C
  y: C

custom_variables:
  - name: log_info
    value: "#[fg=#a6e3a1,italics]"

macros:
  - name: reload-config
    commands:
      - source-file $HOME/.tmux/tmux.conf
      - refresh-client -S
      - display-message "#{log_info}Reloaded tmux config"
  - name: jumpmux-agents
    commands:
      - 'display-popup -h 40 -w 140 -E "jumpmux"'
  - name: jumpmux-sessions
    commands:
      - 'display-popup -h 50 -w 140 -E "jumpmux -t sessions"'
  - name: dev-layout
    commands:
      - 'run-shell "$HOME/.tmux/scripts/dev-layout \"##{pane_current_path}\""'
  - name: extract-text
    commands:
      - 'run-shell "$HOME/.tmux/plugins/extrakto/scripts/open.sh \"##{pane_id}\""'
  - name: toggle-sync
    commands:
      - set-window-option synchronize-panes
      - 'display-message "Sync panes ##{?pane_synchronized,ON,OFF}"'

items:
  - name: Command prompt
    key: ":"
    command: command-prompt

  - name: +Sessions
    key: s
    menu:
      - name: Choose session
        key: s
        command: choose-tree -Zs
      - name: Last session
        key: C-o
        command: run-shell "/home/raphael/go/bin/jumpmux session last"
      - name: Previous
        key: P
        command: switch-client -p
      - name: Next
        key: N
        command: switch-client -n
      - separator: true
      - name: Rename
        key: "&"
        command: 'command-prompt -I "#S" -p "Rename active session to:" { rename-session "%%" }'
      - name: Kill
        key: "*"
        command: 'confirm-before -p "Kill current session?" kill-session'
      - separator: true
      - name: Back
        key: BSpace
        command: "show-wk-menu #{@wk_menu_root}"

  - name: +Windows
    key: w
    menu:
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: New
        key: c
        command: 'new-window -c "#{pane_current_path}"'
      - name: Last
        key: b
        command: last-window
      - name: Next
        key: n
        command: next-window
      - name: Move to session
        key: C-w
        command: 'run-shell "$HOME/.tmux/scripts/move-window"'
      - separator: true
      - name: Rename
        key: ","
        command: 'command-prompt -F -I "#{window_name}" -p "Rename window:" { rename-window -t "#{window_id}" "%%" }'
      - name: Kill
        key: Q
        command: 'confirm-before -p "Kill window #W?" kill-window'
      - separator: true
      - name: Back
        key: BSpace
        command: "show-wk-menu #{@wk_menu_root}"

  - name: +Panes
    key: p
    menu:
      - name: Split horizontal
        key: "/"
        command: 'split-window -h -c "#{pane_current_path}"'
      - name: Split vertical
        key: "-"
        command: 'split-window -v -c "#{pane_current_path}"'
      - separator: true
      - name: Left
        key: h
        command: select-pane -L
      - name: Down
        key: j
        command: select-pane -D
      - name: Up
        key: k
        command: select-pane -U
      - name: Right
        key: l
        command: select-pane -R
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: H
            command: resize-pane -L 5
            transient: true
          - name: Down
            key: J
            command: resize-pane -D 5
            transient: true
          - name: Up
            key: K
            command: resize-pane -U 5
            transient: true
          - name: Right
            key: L
            command: resize-pane -R 5
            transient: true
          - separator: true
          - name: Back
            key: BSpace
            command: "show-wk-menu #{@wk_menu_panes}"
      - separator: true
      - name: Move to window
        key: C-p
        command: 'run-shell "$HOME/.tmux/scripts/move-pane"'
      - name: Swap clockwise
        key: S
        command: swap-pane -D
      - name: Toggle zoom
        key: z
        command: resize-pane -Z
      - name: Power zoom
        key: Z
        command: run-shell $HOME/.tmux/plugins/tmux-power-zoom/scripts/power_zoom.sh
      - name: Toggle sync
        key: y
        macro: toggle-sync
      - name: Kill
        key: x
        command: 'confirm-before -p "Kill pane #P?" kill-pane'
      - separator: true
      - name: Back
        key: BSpace
        command: "show-wk-menu #{@wk_menu_root}"

  - name: +Workflow
    key: d
    menu:
      - name: Jumpmux agents
        key: m
        macro: jumpmux-agents
      - name: Jumpmux sessions
        key: o
        macro: jumpmux-sessions
      - name: Dev layout
        key: W
        macro: dev-layout
      - separator: true
      - name: File picker
        key: C-f
        command: 'display-popup -E "$HOME/.tmux/plugins/tmux-file-picker/tmux-file-picker"'
      - name: Path picker
        key: f
        command: 'run-shell "$HOME/.tmux/plugins/tmux-fpp/fpp.tmux start edit"'
      - name: Extract text
        key: Tab
        macro: extract-text
      - name: Open URL
        key: u
        command: 'run-shell -b "$HOME/.tmux/plugins/tmux-fzf-url/fzf-url.sh screen"'
      - separator: true
      - name: Back
        key: BSpace
        command: "show-wk-menu #{@wk_menu_root}"

  - name: +Client
    key: C
    menu:
      - name: Reload config
        key: r
        macro: reload-config
      - name: Mouse on
        key: e
        command: 'set-option -g mouse on ; display-message "Mouse Mode ON"'
      - name: Mouse off
        key: E
        command: 'set-option -g mouse off ; display-message "Mouse Mode OFF"'
      - separator: true
      - name: Install plugins
        key: I
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
      - name: Update plugins
        key: U
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
      - name: Clean plugins
        key: M-u
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - separator: true
      - name: Customize tmux
        key: C
        command: customize-mode -Z
      - name: Detach
        key: d
        command: detach-client
      - separator: true
      - name: Back
        key: BSpace
        command: "show-wk-menu #{@wk_menu_root}"

  - name: Copy mode
    key: "["
    command: copy-mode
  - name: Paste buffer
    key: "]"
    command: paste-buffer
  - name: Reload config
    key: r
    macro: reload-config
  - name: List keys
    key: "?"
    command: list-keys -N
